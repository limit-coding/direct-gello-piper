    max_gripper_step: 0.12
    max_leader_jump_rad: 0.35
    watchdog_timeout_s: 0.5
    gripper_gamma: 1.0
    invert_gripper: false
    # 正常 Ctrl-C 退出时保持当前姿态，避免电子急停后失力下坠。
    stop_mode: hold
