  piper:
    channel: auto
    serial_number: 003D003D4148571320343133
    interface: gs_usb
    bitrate: 1000000
    feedback_timeout_s: 2.0
    enable_timeout_s: 3.0
    # C 单独提速；B 保持 10%。
